name: PR and CI Summary Comment

on:
  pull_request_target:
    types:
      - opened
  # Update the list below so it matches your CI/CD workflow names.
  workflow_run:
    workflows:
      - CI
      - CD
      - CI/CD
      - Build
      - Tests
      - Test
      - Deploy
      - Deployment
    types:
      - completed

permissions:
  contents: read
  pull-requests: write
  actions: read
  checks: read

jobs:
  post-summary-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update PR summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-ci-summary-comment -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const truncate = (value, max = 1000) => {
              if (!value) return '';
              return value.length > max ? `${value.slice(0, max)}...` : value;
            };

            const getCiSnapshot = async (sha) => {
              const suites = await github.paginate(
                github.rest.checks.listSuitesForRef,
                { owner, repo, ref: sha, per_page: 100 }
              );

              const totals = {
                success: 0,
                failure: 0,
                neutral: 0,
                cancelled: 0,
                skipped: 0,
                pending: 0,
                action_required: 0,
                stale: 0,
                timed_out: 0,
                other: 0
              };

              for (const suite of suites) {
                if (suite.status !== 'completed') {
                  totals.pending += 1;
                  continue;
                }

                const conclusion = suite.conclusion || 'other';
                if (Object.prototype.hasOwnProperty.call(totals, conclusion)) {
                  totals[conclusion] += 1;
                } else {
                  totals.other += 1;
                }
              }

              const parts = [];
              if (totals.success) parts.push(`success: ${totals.success}`);
              if (totals.failure) parts.push(`failure: ${totals.failure}`);
              if (totals.pending) parts.push(`pending: ${totals.pending}`);
              if (totals.cancelled) parts.push(`cancelled: ${totals.cancelled}`);
              if (totals.timed_out) parts.push(`timed_out: ${totals.timed_out}`);
              if (totals.action_required) parts.push(`action_required: ${totals.action_required}`);
              if (totals.neutral) parts.push(`neutral: ${totals.neutral}`);
              if (totals.skipped) parts.push(`skipped: ${totals.skipped}`);
              if (totals.stale) parts.push(`stale: ${totals.stale}`);
              if (totals.other) parts.push(`other: ${totals.other}`);

              if (!parts.length) return 'No CI/CD checks found yet.';
              return parts.join(' | ');
            };

            let prNumber;
            let eventDetails = [];

            if (context.eventName === 'pull_request_target') {
              const openedPr = context.payload.pull_request;
              prNumber = openedPr.number;
              eventDetails = [
                '- **Trigger:** New PR opened',
                `- **Event Action:** ${context.payload.action || 'opened'}`
              ];
            } else if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              const linkedPr = (run.pull_requests || [])[0];

              if (!linkedPr) {
                core.info('Workflow run is not linked to a PR. Skipping comment.');
                return;
              }

              prNumber = linkedPr.number;
              eventDetails = [
                '- **Trigger:** CI/CD workflow completed',
                `- **Workflow:** ${run.name}`,
                `- **Conclusion:** ${run.conclusion || 'unknown'}`,
                `- **Run URL:** ${run.html_url}`
              ];
            } else {
              core.info(`Unsupported event: ${context.eventName}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: prNumber, per_page: 100 }
            );

            const changedFileNames = files.slice(0, 10).map((file) => `- \`${file.filename}\``).join('\n');
            const changedFilesSummary = changedFileNames || '- No changed files detected.';
            const additionalFilesCount = Math.max(files.length - 10, 0);
            const extraFilesLine = additionalFilesCount > 0 ? `\n- ...and ${additionalFilesCount} more file(s)` : '';

            const bodyExcerpt = truncate((pr.body || '').trim(), 1200);
            const bodySection = bodyExcerpt
              ? `### PR Description\n${bodyExcerpt}`
              : '### PR Description\n_No description provided._';

            const ciSnapshot = await getCiSnapshot(pr.head.sha);

            const commentBody = [
              marker,
              '## PR Summary',
              '',
              `- **Title:** ${pr.title}`,
              `- **Author:** @${pr.user.login}`,
              `- **Source Branch:** \`${pr.head.ref}\``,
              `- **Target Branch:** \`${pr.base.ref}\``,
              `- **State:** ${pr.state}`,
              `- **Commits:** ${pr.commits}`,
              `- **Changed Files:** ${pr.changed_files}`,
              `- **Additions/Deletions:** +${pr.additions} / -${pr.deletions}`,
              '',
              '### Changed Files (first 10)',
              `${changedFilesSummary}${extraFilesLine}`,
              '',
              '### CI/CD Status Snapshot',
              `- ${ciSnapshot}`,
              '',
              '### Event Details',
              eventDetails.join('\n'),
              '',
              bodySection,
              '',
              `_Last updated: ${new Date().toISOString()}_`
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: prNumber, per_page: 100 }
            );

            const existing = comments.find((comment) =>
              comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: commentBody
              });
              core.info(`Updated existing PR summary comment for #${prNumber}.`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: commentBody
              });
              core.info(`Created PR summary comment for #${prNumber}.`);
            }
